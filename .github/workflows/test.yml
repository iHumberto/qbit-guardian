name: tests

# Sem filtro de paths, de proposito: a suite roda em QUALQUER mudanca.
#
# Tentador filtrar docs/ aqui tambem, mas a documentacao passou a ser
# verificada por teste (TestDocsContraOCodigo e companhia): um ajuste em
# docs/ pode legitimamente quebrar a suite, e pular os testes nesse caso
# anularia a protecao inteira. A suite leva ~30s; o que custa caro e o build
# multi-arch, e esse sim e filtrado no docker-build.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite que o docker-build reutilize esta suite como gate de publicacao.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest test/ -v
