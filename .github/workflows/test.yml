name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite que o docker-build reutilize esta suite como gate de publicacao.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest test/ -v
