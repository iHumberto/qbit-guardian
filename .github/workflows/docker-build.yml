name: docker-build

on:
  push:
    branches: [main]
    # So reconstroi quando o conteudo da IMAGEM muda. Mexer em docs/, README
    # ou CHANGELOG publicava uma imagem nova e identica no GHCR — e o
    # Watchtower trocava o container em producao sem nada ter mudado.
    #
    # Esta lista espelha o que o Dockerfile COPIA, mais o proprio Dockerfile e
    # os workflows. Ha teste de paridade: test_guardian.py > TestWorkflowBuild.
    #
    # Push de TAG ignora paths (comportamento do GitHub Actions), entao
    # `git tag -a v2.4.0 && git push --tags` continua publicando normalmente.
    paths:
      - 'app/**'
      - 'static/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/test.yml'
    tags:
      - 'v*'

jobs:
  # Gate de publicacao: a imagem nao sobe para o GHCR com a suite vermelha.
  # Antes os dois workflows corriam em paralelo e independentes no push para
  # main, entao um teste quebrado nao impedia o build.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ihumberto
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ihumberto/qbit-guardian
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
