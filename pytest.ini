[pytest]
# Timeout POR TESTE, nao para a suite inteira.
#
# A suite completa roda em ~29 s e nenhum teste individual passa de 1 s, logo
# 45 s e folga generosa: nao incomoda teste legitimo e ainda pega loop que gira.
#
# Existe porque o codigo tem `while True` (guardian_loop, _reevaluate_loop) e a
# suite os chama. Um teste cuja condicao de parada falhe entra em espera, cai no
# `except Exception` do ciclo e volta ao laco — ficando pendurado ate alguem
# notar. Ja aconteceu: a troca de `get_config` por `load_config` nos loops
# deixou o `_LoopHarness` sem efeito e levou a suite de 29 s para travada.
#
# O metodo fica no default (`signal` onde houver SIGALRM): ele interrompe a
# espera no thread principal, que e onde os testes de loop bloqueiam.
timeout = 45
